name = "nexopress-hub"
main = "src/index.js"
compatibility_date = "2026-06-10"
workers_dev = true

# Permite que el Hub haga fetch() a los CMS Workers (*.workers.dev) que viven
# en la misma cuenta/zona de Cloudflare. Sin este flag, Cloudflare bloquea
# el subrequest con "error code: 1042" (mismo zone, mismo owner).
# Docs: https://developers.cloudflare.com/workers/configuration/compatibility-flags/#global-fetch-strictly-public
compatibility_flags = ["global_fetch_strictly_public"]

[vars]
ENVIRONMENT = "production"
CMS_ORIGINAUX_URL = "https://cms-originaux.sebastianvernis.workers.dev"
CMS_NUEVOS_URL    = "https://cms-nuevos.sebastianvernis.workers.dev"
CMS_NUEVOS2_URL   = "https://cms-nuevos2.sebastianvernis.workers.dev"
CMS_NUEVOS3_URL   = "https://cms-nuevos3.sebastianvernis.workers.dev"
CMS_NUEVOS4_URL   = "https://cms-nuevos4.sebastianvernis.workers.dev"
ALLOWED_ORIGINS = "https://hub.sebastianvernis.space,https://nexopress-hub-ui.pages.dev,https://nexopress-hub.sebastianvernis.workers.dev,https://nexopress-hub.chispakimnueve.workers.dev,https://cms-originaux.chispakimnueve.workers.dev,https://cms-nuevos.chispakimnueve.workers.dev,https://cms-nuevos2.chispakimnueve.workers.dev,https://cms-nuevos3.chispakimnueve.workers.dev,https://cms-nuevos4.chispakimnueve.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "nexopress-hub-db"
database_id = "2a79f2eb-3189-4299-8f82-1c231d705bb3"

[[kv_namespaces]]
binding = "HUB_KV"
id = "1ae7c046e7b24bec8f11c463ad289945"

[[kv_namespaces]]
binding = "HUB_VALIDATION_CACHE"
id = "0dc9c36b03344302a73b162e27b07849"

# ── Service bindings: el Hub invoca los CMSs por binding, no por URL ────
# Sin esto, el fetch() del Hub a los CMS workers (mismo *.workers.dev zone)
# es bloqueado por Cloudflare con "error code: 1042".
#
# Esto es la solución correcta al bug "no se puede guardar artículos" en el Hub.
# Cada binding hace que el CMS sea accesible desde el código JS del Hub vía
# `env.CMS_<KEY>.fetch(request)`, sin pasar por la red pública.
[[services]]
binding = "CMS_ORIGINAUX"
service = "cms-originaux"

[[services]]
binding = "CMS_NUEVOS"
service = "cms-nuevos"

[[services]]
binding = "CMS_NUEVOS2"
service = "cms-nuevos2"

[[services]]
binding = "CMS_NUEVOS3"
service = "cms-nuevos3"

[[services]]
binding = "CMS_NUEVOS4"
service = "cms-nuevos4"