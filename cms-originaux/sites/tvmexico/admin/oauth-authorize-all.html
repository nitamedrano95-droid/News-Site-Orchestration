<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Reautorizando páginas...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 2rem;
      max-width: 500px;
      text-align: center;
    }
    h1 { color: #1f2937; margin-bottom: 1rem; font-size: 1.5rem; }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 1.5rem auto;
      border: 4px solid #e5e7eb;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #6b7280; line-height: 1.6; margin-bottom: 1rem; }
    .error {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1rem;
      display: none;
    }
    .error.show { display: block; }
    code {
      background: #f3f4f6;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      color: #1f2937;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Reautorizando todas las páginas...</h1>
    <div class="spinner"></div>
    <p>Obteniendo token de sesión...</p>
    <div class="error" id="error"></div>
  </div>
  <script>
    var token = localStorage.getItem('CMS_AUTH_TOKEN');
    if (!token) {
      document.querySelector('.spinner').style.display = 'none';
      document.querySelector('p').textContent = 'No hay sesión activa. Abre el admin primero.';
    } else {
      var host = window.location.hostname;
      var cms = host.replace('cms-admin-', '').replace('.pages.dev', '');
      var workerHost = 'cms-' + cms + '.sebastianvernis.workers.dev';
      var targetUrl = 'https://' + workerHost + '/api/facebook/oauth/start-all?auth=' + encodeURIComponent(token);
      window.location.href = targetUrl;
    }
  </script>
</body>
</html>
