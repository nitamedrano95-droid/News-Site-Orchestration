name = "cms-nuevos4"
main = "src/index.js"
compatibility_date = "2023-12-01"
account_id = "adf5d76bca341500fec8b8c04941978a"
workers_dev = true

# Rutas para los 25 sitios Pages (subdominios .pages.dev)
# NOTA: Agregar cuando los sitios Pages esten deployados y las zonas existan.
#       Comando para agregar luego: wrangler route ...
# routes = [
#   { pattern = "cronicanacionalmx.pages.dev", zone_name = "cronicanacionalmx.pages.dev" },
#   ... (ver slugs en themes.json)
# ]

[vars]
ENVIRONMENT = "production"
# URL del Hub para que el CMS pueda validar tokens de sesión del Hub vía
# /api/auth/validate-token. Sin esto, los tokens emitidos por el Hub son
# rechazados por el CMS con 401, y todo el flujo de guardado desde el Hub UI
# falla.
HUB_API_URL = "https://nexopress-hub.sebastianvernis.workers.dev"

# SECRETS / VARIABLES DE ENTORNO PENDIENTES (configurar con wrangler secret put):
#   ADMIN_TOKEN          -> wrangler secret put ADMIN_TOKEN
#   USER_PASSWORD_HASH   -> wrangler secret put USER_PASSWORD_HASH
#   OPENWEATHER_API_KEY  -> wrangler secret put OPENWEATHER_API_KEY
#   FB_APP_ID            -> wrangler secret put FB_APP_ID
#   FB_APP_SECRET        -> wrangler secret put FB_APP_SECRET
#   SITE_URL             -> wrangler secret put SITE_URL

[[d1_databases]]
binding = "DB"
database_name = "news_db_cms_nuevos4"
database_id = "a3643283-0da0-4503-80d2-069e404f1fef"

[[kv_namespaces]]
binding = "ARTICLES_KV"
id = "0df031bf42ad4d37a284543fa3c9e57a"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "cms-news"

[triggers]
# crons = ["*/30 * * * *"]  # disabled jun 2026 - n8n controls ingest now

[observability]
enabled = false

[observability.logs]
enabled = true
persist = true
invocation_logs = true

[ai]
binding = "AI"

migrations_dir = "./migrations"
