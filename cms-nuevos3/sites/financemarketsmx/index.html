<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>financemarketsmx - News</title>
    <meta content="News site" name="description"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" media="print" onload="this.media='all'"/>
    <link href="/style.css" rel="stylesheet" media="print" onload="this.media='all'"/>
    <link href="/style-custom.css" rel="stylesheet" media="print" onload="this.media='all'"/>
    <link rel="alternate" type="application/rss+xml" title="financemarketsmx RSS" href="/rss.xml"/>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="theme-color" content="#11787D">
</head>
<body>
    <div id="site-preloader"><div class="loader"></div></div>
    <div id="site-header"></div>

    <main class="main-content" style="margin-top: 10px;">
    </main>

    <div id="site-footer"></div>

    <script src="/pwa-manager.js" defer></script>
    <script src="/script.js" defer></script>
    <script src="/components.js" defer></script>
    <script>
    (async function(){
        const apiUrl = 'https://cms-nuevos3.sebastianvernis.workers.dev/api/articles?site=financemarketsmx&limit=12';
        const defaultImg = '/logo-header.png';
        let articles = [];

        const esc = (s='') => String(s)
          .replaceAll('&','&amp;')
          .replaceAll('<','<')
          .replaceAll('>','>')
          .replaceAll('"','"')
          .replaceAll("'","&#39;");

        const safeUrl = (url) => {
          try { return new URL(url || defaultImg, location.origin).href; }
          catch { return defaultImg; }
        };

        try {
            const res = await fetch(apiUrl);
            if(!res.ok) throw new Error('Network');
            const data = await res.json();
            articles = Array.isArray(data.articles) ? data.articles : [];
        } catch(e) {
            if (window.PWAManager?.getLocalArticles) {
              articles = await PWAManager.getLocalArticles();
            }
        }

        if(!articles.length) return;
        const hero = articles[0];
        const cards = articles.slice(1);
        const container = document.querySelector('.main-content');
        if(!container) return;

        const now = new Date();
        const dateStr = now.toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        container.innerHTML = `
          <div class="finance-layout">
            <div class="finance-header">
              <div style="text-align:center;padding:20px 0;">
                <p style="font-size:0.8em;color:#065f46;font-weight:600;text-transform:uppercase;letter-spacing:1px;">${esc(dateStr)}</p>
              </div>
            </div>
            <a href="/articulo/?slug=${encodeURIComponent(hero?.slug || '')}" class="finance-hero">
              <img src="${safeUrl(hero?.imageUrl)}" alt="${esc(hero?.title || '')}">
              <div class="finance-hero-overlay">
                <span style="display:inline-block;padding:4px 14px;background:#065f46;color:#fff;font-size:0.7em;font-weight:800;text-transform:uppercase;border-radius:20px;margin-bottom:12px;">${esc(hero?.category || 'Finanzas')}</span>
                <h1 style="font-size:2em;font-weight:800;line-height:1.2;margin-bottom:8px;">${esc(hero?.title || '')}</h1>
                <p style="font-size:0.95em;opacity:0.85;">${esc((hero?.desc || '').slice(0, 200))}${hero?.desc ? '...' : ''}</p>
              </div>
            </a>
            <div class="finance-grid">
              ${cards.map(a => `
                <a href="/articulo/?slug=${encodeURIComponent(a?.slug || '')}" class="fin-card">
                  <div style="height:160px;overflow:hidden;">
                    <img src="${safeUrl(a?.imageUrl)}" alt="${esc(a?.title || '')}" style="width:100%;height:100%;object-fit:cover;">
                  </div>
                  <div style="padding:16px;">
                    <span style="display:inline-block;padding:2px 10px;background:#a7f3d0;color:#065f46;font-size:0.7em;font-weight:800;text-transform:uppercase;border-radius:12px;margin-bottom:8px;">${esc(a?.category || 'Finanzas')}</span>
                    <h3 style="font-size:1em;font-weight:700;line-height:1.3;margin-bottom:6px;">${esc(a?.title || '')}</h3>
                    <p style="font-size:0.85em;color:#4b5563;line-height:1.5;">${esc((a?.desc || '').slice(0, 90))}${a?.desc ? '...' : ''}</p>
                  </div>
                </a>
              `).join('')}
            </div>
          </div>
        `;
    })();
    </script>
    <script>
      if('serviceWorker' in navigator){
        window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
      }
    </script>
</body>
</html>
