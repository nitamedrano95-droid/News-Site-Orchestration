<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>financemarketsmx - News</title>
    <meta content="News site" name="description"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" media="print" onload="this.media='all'"/>
    <link href="style.css" rel="stylesheet" media="print" onload="this.media='all'"/>
    <link href="style-custom.css" rel="stylesheet" media="print" onload="this.media='all'"/>
    <link rel="alternate" type="application/rss+xml" title="financemarketsmx RSS" href="/rss.xml"/>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="theme-color" content="#065f46">
</head>
<body>
    <div id="site-preloader"><div class="loader"></div></div>
    <div id="site-header"></div>

    <main class="main-content" style="margin-top: 10px;">
    </main>

    <div id="site-footer"></div>

    <script src="pwa-manager.js" defer></script>
    <script src="script.js" defer></script>
    <script src="components.js" defer></script>
    <script>
    (async function(){
        function isWeatherArticle(t){return t&&(t.includes('Clima')||t.includes('No Circula')||t.includes('Hoy No'));}const apiUrl = 'https://cms-nuevos.sebastianvernis.workers.dev/api/articles?site=financemarketsmx&limit=12';
        let articles = [];
        try {
            const res = await fetch(apiUrl);
            if(!res.ok) throw new Error('Network');
            const data = await res.json();
            articles = data.articles || [];
        } catch(e) {
            if (window.PWAManager) articles = await PWAManager.getLocalArticles();
        }
        if(!articles?.length) return;
        const hero = articles[0];
        const cards = articles.slice(1);
        const container = document.querySelector('.main-content');
        if(container) {
            const now = new Date();
            const dateStr = now.toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            container.innerHTML = '<div class="finance-layout">' +
                '<div class="finance-header">' +
                '<div style="text-align:center;padding:20px 0;">' +
                '<p style="font-size:0.8em;color:#065f46;font-weight:600;text-transform:uppercase;letter-spacing:1px;">' + dateStr + '</p>' +
                '</div></div>' +
                '<a href="/articulo/?slug=' + encodeURIComponent(hero.slug) + '" class="finance-hero">' +
                '<img src="' + (hero.imageUrl || ' + base + 'logo-header.png' ) + '" alt="' + hero.title + '">' +
                '<div class="finance-hero-overlay">' +
                '<span style="display:inline-block;padding:4px 14px;background:#065f46;color:#fff;font-size:0.7em;font-weight:800;text-transform:uppercase;border-radius:20px;margin-bottom:12px;">' + (hero.category || 'Finanzas') + '</span>' +
                '<h1 style="font-size:2em;font-weight:800;line-height:1.2;margin-bottom:8px;">' + hero.title + '</h1>' +
                '<p style="font-size:0.95em;opacity:0.85;">' + (hero.desc ? hero.desc.substring(0, 200) + '...' : '') + '</p>' +
                '</div></a>' +
                '<div class="finance-grid">' + cards.map(a =>
                    '<a href="/articulo/?slug=' + encodeURIComponent(a.slug) + '" class="fin-card">' +
                    '<div style="height:160px;overflow:hidden;"><img src="' + (a.imageUrl || ' + base + 'logo-header.png' ) + '" alt="' + a.title + '" style="width:100%;height:100%;object-fit:cover;"></div>' +
                    '<div style="padding:16px;"><span style="display:inline-block;padding:2px 10px;background:#a7f3d0;color:#065f46;font-size:0.7em;font-weight:800;text-transform:uppercase;border-radius:12px;margin-bottom:8px;">' + (a.category || 'Finanzas') + '</span>' +
                    '<h3 style="font-size:1em;font-weight:700;line-height:1.3;margin-bottom:6px;">' + a.title + '</h3>' +
                    '<p style="font-size:0.85em;color:#4b5563;line-height:1.5;">' + (a.desc ? a.desc.substring(0, 90) + '...' : '') + '</p></div></a>'
                ).join('') + '</div></div>';
        }
    })();
    </script>
</body>
    <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}</script>
</html>
