<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>republicamx - News</title>
    <meta content="News site" name="description"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="style.css" rel="stylesheet"/>
    <link href="style-custom.css" rel="stylesheet"/>
    <link rel="alternate" type="application/rss+xml" title="republicamx RSS" href="/rss.xml"/>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="theme-color" content="#1d4ed8">
</head>
<body>
    <div id="site-preloader"><div class="loader"></div></div>
    <div id="site-header"></div>
    
    <main class="main-content">
    </main>

    <div id="site-footer"></div>
    
    <script src="pwa-manager.js"></script>
    <script src="components.js"></script>
    <script>
    (async function(){
        const apiUrl = 'https://cms-nuevos3.sebastianvernis.workers.dev/api/articles?site=republicamx&limit=12';
        let articles = [];
        try {
            const res = await fetch(apiUrl);
            if(!res.ok) throw new Error('Network');
            const data = await res.json();
            articles = data.articles || [];
        } catch(e) {
            if (window.PWAManager) articles = await PWAManager.getLocalArticles();
        }
        if(!articles?.length) return;
        const hero = articles.slice(0, 2);
        const grid = articles.slice(2);
        const container = document.querySelector('.main-content');
        if(container) {
            container.innerHTML = '<div class="bold-hero-row">' + hero.map((a, i) =>
                '<a href="/articulo/?slug=' + encodeURIComponent(a.slug) + '" class="bold-hero ' + (i === 0 ? 'hero-primary' : 'hero-secondary') + '">' +
                '<img src="' + (a.imageUrl || 'https://placehold.co/' + (i===0 ? '800x600' : '600x400') + '/1d4ed8/ffffff?text=News') + '" alt="' + a.title + '">' +
                '<div class="bold-overlay"><span class="bold-cat">' + (a.category || 'Noticias') + '</span>' +
                '<h2>' + a.title + '</h2><p>' + (a.desc ? a.desc.substring(0, i===0 ? 200 : 100) + '...' : '') + '</p></div></a>'
            ).join('') + '</div>' +
            '<h2 class="bold-section-title">Noticias Destacadas</h2><div class="bold-grid">' + grid.map(a =>
                '<a href="/articulo/?slug=' + encodeURIComponent(a.slug) + '" class="bold-card">' +
                '<div class="bold-img-wrap"><img src="' + (a.imageUrl || 'https://placehold.co/600x400/1d4ed8/ffffff?text=News') + '" alt="' + a.title + '"></div>' +
                '<div class="bold-card-body"><span class="bold-cat">' + (a.category || 'Noticias') + '</span>' +
                '<h3>' + a.title + '</h3><p>' + (a.desc ? a.desc.substring(0, 140) + '...' : '') + '</p></div></a>'
            ).join('') + '</div>';
        }
    })();
    </script>
</body>
</html>
