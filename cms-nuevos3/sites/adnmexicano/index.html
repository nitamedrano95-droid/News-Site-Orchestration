<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>ADN Mexicano - La esencia de Mexico</title>
    <meta content="La esencia de Mexico" name="description"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="style.css" rel="stylesheet"/>
    <link href="style-custom.css" rel="stylesheet"/>
    <link rel="alternate" type="application/rss+xml" title="ADN Mexicano RSS" href="/rss.xml"/>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="theme-color" content="#be123c">
</head>
<body>
    <div id="site-preloader"><div class="loader"></div></div>
    <div id="site-header"></div>
    
    <main class="main-content" style="margin-top: 10px;">
    </main>

    <div id="site-footer"></div>
    
    <script src="pwa-manager.js"></script>
    <script src="script.js"></script>
    <script src="components.js"></script>
    <script>
    (async function(){
        const apiUrl = 'https://cms-nuevos3.sebastianvernis.workers.dev/api/articles?site=adnmexicano&limit=12';
        let articles = [];
        try {
            const res = await fetch(apiUrl);
            if(!res.ok) throw new Error('Network');
            const data = await res.json();
            articles = data.articles || [];
        } catch(e) {
            if (window.PWAManager) articles = await PWAManager.getLocalArticles();
        }
        if(!articles?.length) return;
        const hero = articles[0];
        const cards = articles.slice(1);
        const container = document.querySelector('.main-content');
        if(container) {
            container.innerHTML = '<div class="split-editorial"><aside class="split-left"><div class="sticky-hero">' +
                '<a href="/articulo/?slug=' + encodeURIComponent(hero.slug) + '">' +
                '<div class="hero-img" style="background-image:url(\'' + (hero.imageUrl || 'https://placehold.co/800x1000/be123c/ffffff?text=News') + '\')"></div>' +
                '<div class="hero-text"><span class="hero-cat">' + (hero.category || 'Noticias') + '</span>' +
                '<h1>' + hero.title + '</h1><p>' + (hero.desc ? hero.desc.substring(0, 300) + '...' : '') + '</p></div></a></div></aside>' +
                '<div class="split-right"><h2 class="section-label">M&aacute;s Noticias</h2><div class="editorial-list">' +
                cards.map(a =>
                    '<a href="/articulo/?slug=' + encodeURIComponent(a.slug) + '" class="editorial-card">' +
                    '<div class="editorial-img" style="background-image:url(\'' + (a.imageUrl || 'https://placehold.co/400x300/be123c/ffffff?text=News') + '\')"></div>' +
                    '<div class="editorial-body"><span class="editorial-cat">' + (a.category || 'Noticias') + '</span>' +
                    '<h3>' + a.title + '</h3><p>' + (a.desc ? a.desc.substring(0, 150) + '...' : '') + '</p>' +
                    '<span class="read-more">Leer m&aacute;s &rarr;</span></div></a>'
                ).join('') + '</div></div></div>';
        }
    })();
    </script>
</body>
</html>
