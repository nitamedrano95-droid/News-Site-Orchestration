<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Observador Republicano - Vigilancia informativa</title>
  <meta name="description" content="Vigilancia informativa">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;600;700|Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%233f6212'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EE%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style-custom.css">
</head>
<body>
  <div id="site-preloader"></div>
  <div id="site-header"></div>
  <main class="container">
    <section class="hero-observer">
    <div class="panorama-bar"></div>
    <div class="observer-content">
      <span class="category-tag">Observatorio</span>
      <h1>Vigilancia constante de la republica</h1>
      <p>Monitoreamos los acontecimientos para mantenerte informado.</p>
    </div>
    <div class="observer-horizon"></div>
  </section>
    <section class="observer-grid">
    <article class="obs-card panorama"><div class="obs-img" style="background:#3f6212;"></div><div class="obs-body"><span class="tag">Observatorio</span><h3>Panorama nacional del dia</h3><p>Vista completa de los acontecimientos.</p></div></article>
    <article class="obs-card"><div class="obs-body"><span class="tag">Alerta</span><h3>Evento en desarrollo</h3><p>Monitoreo continuo.</p></div></article>
    <article class="obs-card"><div class="obs-body"><span class="tag">Reporte</span><h3>Estado de la republica</h3><p>Indicadores del dia.</p></div></article>
  </section>
  </main>
  <div id="site-footer"></div>
  <script src="components.js"></script>
</body>
</html>
