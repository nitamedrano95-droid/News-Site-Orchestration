<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>elprofetamexicano - News</title>
    <meta content="News site" name="description"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="style.css" rel="stylesheet"/>
    <link href="style-custom.css" rel="stylesheet"/>
    <link rel="alternate" type="application/rss+xml" title="elprofetamexicano RSS" href="/rss.xml"/>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="theme-color" content="#581c87">
</head>
<body>
    <div id="site-preloader"><div class="loader"></div></div>
    <div id="site-header"></div>
    
    <main class="main-content">
    </main>

    <div id="site-footer"></div>
    
    <script src="pwa-manager.js"></script>
    <script src="script.js"></script>
    <script src="components.js"></script>
    <script>
    (async function(){
        const apiUrl = 'https://cms-nuevos3.sebastianvernis.workers.dev/api/articles?site=elprofetamexicano&limit=12';
        let articles = [];
        try {
            const res = await fetch(apiUrl);
            if(!res.ok) throw new Error('Network');
            const data = await res.json();
            articles = data.articles || [];
        } catch(e) {
            if (window.PWAManager) articles = await PWAManager.getLocalArticles();
        }
        if(!articles?.length) return;
        const hero = articles[0];
        const cards = articles.slice(1);
        const container = document.querySelector('.main-content');
        if(container) {
            container.innerHTML = '<div class="cinematic-hero" style="background-image:url('' + (hero.imageUrl || 'https://placehold.co/1600x900/581c87/ffffff?text=News') + '')">' +
                '<div class="cinematic-overlay"></div><div class="cinematic-content">' +
                '<span class="cinematic-cat">' + (hero.category || 'Noticias') + '</span>' +
                '<h1>' + hero.title + '</h1><p>' + (hero.desc ? hero.desc.substring(0, 300) + '...' : '') + '</p>' +
                '<a href="/articulo/?slug=' + encodeURIComponent(hero.slug) + '" class="cinematic-btn">Leer Art&iacute;culo</a></div></div>' +
                '<div class="cinematic-grid">' + cards.map(a =>
                    '<a href="/articulo/?slug=' + encodeURIComponent(a.slug) + '" class="cine-card">' +
                    '<div class="cine-img"><img src="' + (a.imageUrl || 'https://placehold.co/600x400/581c87/ffffff?text=News') + '" alt="' + a.title + '">' +
                    '<div class="cine-img-overlay"></div></div>' +
                    '<div class="cine-body"><span class="cine-cat">' + (a.category || 'Noticias') + '</span>' +
                    '<h3>' + a.title + '</h3><p>' + (a.desc ? a.desc.substring(0, 120) + '...' : '') + '</p></div></a>'
                ).join('') + '</div>';
        }
    })();
    </script>
</body>
</html>
