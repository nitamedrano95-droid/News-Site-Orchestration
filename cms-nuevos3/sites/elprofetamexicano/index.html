<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>elprofetamexicano - News</title>
    <meta content="News site" name="description"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" media="print" onload="this.media='all'"/>
    <link href="/style.css" rel="stylesheet" media="print" onload="this.media='all'"/>
    <link href="/style-custom.css" rel="stylesheet" media="print" onload="this.media='all'"/>
    <link rel="alternate" type="application/rss+xml" title="elprofetamexicano RSS" href="/rss.xml"/>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="theme-color" content="#581c87">
</head>
<body>
    <div id="site-preloader"><div class="loader"></div></div>
    <div id="site-header"></div>
    
    <main class="main-content" style="margin-top: 10px;">
    </main>

    <div id="site-footer"></div>
    
    <script src="/pwa-manager.js" defer></script>
    <script src="/script.js" defer></script>
    <script src="/components.js" defer></script>
    <script>
    (async function(){
        const apiUrl = 'https://cms-nuevos3.sebastianvernis.workers.dev/api/articles?site=elprofetamexicano&limit=12';
        const defaultImg = '/logo-header.png';
        let articles = [];

        const esc = (s='') => String(s)
          .replaceAll('&','&amp;')
          .replaceAll('<','<')
          .replaceAll('>','>')
          .replaceAll('"','"')
          .replaceAll("'","&#39;");

        const safeUrl = (url) => {
          try { return new URL(url || defaultImg, location.origin).href; }
          catch { return defaultImg; }
        };

        try {
            const res = await fetch(apiUrl);
            if(!res.ok) throw new Error('Network');
            const data = await res.json();
            articles = Array.isArray(data.articles) ? data.articles : [];
        } catch(e) {
            if (window.PWAManager?.getLocalArticles) {
              articles = await PWAManager.getLocalArticles();
            }
        }

        if(!articles.length) return;
        const hero = articles[0];
        const cards = articles.slice(1);
        const container = document.querySelector('.main-content');
        if(!container) return;

        container.innerHTML = `
          <div class="cinematic-hero" style="background-image:url('${safeUrl(hero?.imageUrl)}')">
            <div class="cinematic-overlay"></div>
            <div class="cinematic-content">
              <span class="cinematic-cat">${esc(hero?.category || 'Noticias')}</span>
              <h1>${esc(hero?.title || '')}</h1>
              <p>${esc((hero?.desc || '').slice(0, 300))}${hero?.desc ? '...' : ''}</p>
              <a href="/articulo/?slug=${encodeURIComponent(hero?.slug || '')}" class="cinematic-btn">Leer Artículo</a>
            </div>
          </div>
          <div class="cinematic-grid">
            ${cards.map(a => `
              <a href="/articulo/?slug=${encodeURIComponent(a?.slug || '')}" class="cine-card">
                <div class="cine-img">
                  <img src="${safeUrl(a?.imageUrl)}" alt="${esc(a?.title || '')}">
                  <div class="cine-img-overlay"></div>
                </div>
                <div class="cine-body">
                  <span class="cine-cat">${esc(a?.category || 'Noticias')}</span>
                  <h3>${esc(a?.title || '')}</h3>
                  <p>${esc((a?.desc || '').slice(0, 120))}${a?.desc ? '...' : ''}</p>
                </div>
              </a>
            `).join('')}
          </div>
        `;
    })();
    </script>
    <script>
      if('serviceWorker' in navigator){
        window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
      }
    </script>
</body>
</html>
