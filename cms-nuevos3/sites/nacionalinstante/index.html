<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nacional al Instante - Noticias en tiempo real</title>
  <meta name="description" content="Noticias en tiempo real">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue|Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23be123c'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EN%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style-custom.css">
</head>
<body>
  <div id="site-preloader"></div>
  <div id="site-header"></div>
  <main class="container">
    <section class="hero-instant">
    <div class="clock-face">
      <div class="hand hour"></div>
      <div class="hand minute"></div>
    </div>
    <div class="instant-content">
      <span class="live-badge">AHORA</span>
      <h1>Noticias en tiempo real, sin demora</h1>
      <p>La informacion fluye tan rapido como ocurre.</p>
    </div>
  </section>
    <section class="instant-feed">
    <h2 class="section-title">Tiempo Real</h2>
    <div class="feed-list">
      <div class="feed-item urgent"><span class="feed-time">Ahora</span><h4>Noticia de ultimo momento en desarrollo</h4></div>
      <div class="feed-item"><span class="feed-time">Hace 15m</span><h4>Actualizacion de informacion oficial</h4></div>
      <div class="feed-item"><span class="feed-time">Hace 30m</span><h4>Reacciones de actores politicos</h4></div>
      <div class="feed-item"><span class="feed-time">Hace 45m</span><h4>Primeros datos confirmados</h4></div>
    </div>
  </section>
  </main>
  <div id="site-footer"></div>
  <script src="components.js"></script>
</body>
</html>
