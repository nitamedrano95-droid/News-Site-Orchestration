<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Cargando...</title>
    <meta name="description" id="page-desc" content="">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../article.css">
    <link rel="stylesheet" href="../style-custom.css">
</head>
<body>
    <div id="site-preloader"></div>
    <div id="site-header"></div>

    <main class="main-content article-page">
        <div class="container">
            <div id="article-loading" style="text-align:center;padding:60px 20px;">
                <p style="font-size:1.1rem;color:#666;">Cargando artículo...</p>
            </div>
            <div id="article-error" style="display:none;text-align:center;padding:60px 20px;">
                <h2>Artículo no encontrado</h2>
                <p style="color:#666;margin:20px 0;">El artículo que buscas no está disponible.</p>
                <a href="../index.html" style="color:var(--primary);font-weight:bold;">
                    <i class="fas fa-arrow-left"></i> Volver al inicio
                </a>
            </div>
            <article id="article-content" class="article-full" style="display:none;">
                <div class="article-header">
                    <div class="breadcrumb" style="margin-bottom:12px;">
                        <a href="../index.html">Inicio</a>
                        <span style="margin:0 6px;color:#999;">/</span>
                        <span id="art-category-breadcrumb"></span>
                    </div>
                    <span id="art-category-badge" class="article-category-badge"></span>
                    <h1 id="art-title" class="article-title"></h1>
                    <div class="article-meta">
                        <span class="author"><i class="far fa-user"></i> Por <span id="art-author"></span></span>
                        <span class="separator">•</span>
                        <span class="date"><i class="far fa-calendar"></i> <span id="art-date"></span></span>
                    </div>
                </div>
                <div class="article-image-wrapper" id="art-image-wrapper">
                    <img id="art-image" class="article-image" src="" alt="" loading="lazy"
                         style="width:100%;max-height:500px;object-fit:cover;border-radius:8px;margin:20px 0;">
                </div>
                <div id="art-body" class="article-content"></div>
                <div class="article-footer" style="margin-top:30px;padding-top:20px;border-top:1px solid #eee;">
                    <div class="article-share">
                        <span style="font-weight:bold;margin-right:10px;">Compartir:</span>
                        <a id="share-fb" href="#" target="_blank" rel="noopener" style="margin-right:8px;"><i class="fab fa-facebook-f"></i></a>
                        <a id="share-tw" href="#" target="_blank" rel="noopener" style="margin-right:8px;"><i class="fab fa-twitter"></i></a>
                        <a id="share-wa" href="#" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i></a>
                    </div>
                </div>
                <div style="margin-top:30px;">
                    <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
                </div>
            </article>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="../script.js"></script>
    <script src="../components.js"></script>
    <script>
(function () {
  const params = new URLSearchParams(location.search);
  const slug = params.get("slug");
  const defaultImg = "../logo-header.png";
  const loadingEl = document.getElementById("article-loading");
  const errorEl = document.getElementById("article-error");
  const contentEl = document.getElementById("article-content");
  const preloaderEl = document.getElementById("site-preloader");

  function safeUrl(url) {
    try { return new URL(url || defaultImg, location.origin).href; } catch { return defaultImg; }
  }
  function hidePreloader() { if (preloaderEl) preloaderEl.classList.add("hidden"); }
  function showError() { if (loadingEl) loadingEl.style.display = "none"; if (errorEl) errorEl.style.display = "block"; hidePreloader(); }
  function setText(id, value) { const el = document.getElementById(id); if (el) el.textContent = value || ""; }
  function setHref(id, value) { const el = document.getElementById(id); if (el) el.href = value; }

  function renderBodySafely(target, html, fallbackText) {
    if (!target) return;
    target.textContent = "";
    if (!html || typeof html !== "string") {
      const p = document.createElement("p");
      p.textContent = fallbackText || "";
      target.appendChild(p);
      return;
    }
    const tpl = document.createElement("template");
    tpl.innerHTML = html;
    tpl.content.querySelectorAll("script,iframe,object,embed,link,style").forEach((n) => n.remove());
    tpl.content.querySelectorAll("*").forEach((node) => {
      [...node.attributes].forEach((attr) => {
        const n = attr.name.toLowerCase();
        const v = String(attr.value || "");
        if (n.startsWith("on")) node.removeAttribute(attr.name);
        if ((n === "src" || n === "href") && /^\s*javascript:/i.test(v)) node.removeAttribute(attr.name);
      });
    });
    target.appendChild(tpl.content);
  }

  async function init() {
    if (!slug) return showError();
    try {
      const res = await fetch("https://cms-nuevos3.sebastianvernis.workers.dev/api/articles/" + encodeURIComponent(slug));
      if (!res.ok) throw new Error("not found");
      const data = await res.json();
      const a = data?.article;
      if (!a) throw new Error("empty");

      document.title = (a.title || "Artículo") + " - mexicoandtheworld";
      const desc = document.getElementById("page-desc");
      if (desc) desc.content = a.excerpt || a.desc || "";

      const cat = a.category || "Noticias";
      setText("art-category-breadcrumb", cat);
      setText("art-category-badge", cat);
      const badge = document.getElementById("art-category-badge");
      if (badge) badge.className = "article-category-badge cat-" + String(cat).toLowerCase().replace(/\s+/g, "-");

      setText("art-title", a.title || "");
      setText("art-author", a.author || "Redacción");
      setText("art-date", a.publishedAt ? new Date(a.publishedAt).toLocaleDateString("es-MX", { year: "numeric", month: "long", day: "numeric" }) : "");

      const imgWrapper = document.getElementById("art-image-wrapper");
      const img = document.getElementById("art-image");
      if (img) {
        if (a.imageUrl) {
          img.src = safeUrl(a.imageUrl);
          img.alt = a.title || "Imagen del artículo";
          img.onerror = function () { this.src = safeUrl(defaultImg); this.alt = "Imagen no disponible"; };
        } else if (imgWrapper) imgWrapper.style.display = "none";
      }

      renderBodySafely(document.getElementById("art-body"), a.content || "", a.excerpt || a.desc || "");

      const shareUrl = encodeURIComponent(location.href);
      const shareText = encodeURIComponent(a.title || "");
      setHref("share-fb", "https://www.facebook.com/sharer/sharer.php?u=" + shareUrl);
      setHref("share-tw", "https://twitter.com/intent/tweet?url=" + shareUrl + "&text=" + shareText);
      setHref("share-wa", "https://wa.me/?text=" + shareText + "%20" + shareUrl);

      if (loadingEl) loadingEl.style.display = "none";
      if (contentEl) contentEl.style.display = "block";
      hidePreloader();
    } catch { showError(); }
  }

  init();
})();
    </script>
</body>
</html>
