<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>pulsorepublicanonoticias - News</title>
    <meta content="News site" name="description"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="style.css" rel="stylesheet"/>
    <link href="style-custom.css" rel="stylesheet"/>
    <link rel="alternate" type="application/rss+xml" title="pulsorepublicanonoticias RSS" href="/rss.xml"/>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="theme-color" content="#dc2626">
</head>
<body>
    <div id="site-preloader"><div class="loader"></div></div>
    <div id="site-header"></div>
    
    <main class="main-content" style="margin-top: 10px;">
    </main>

    <div id="site-footer"></div>
    
    <script src="pwa-manager.js"></script>
    <script src="script.js"></script>
    <script src="components.js"></script>
    <script>
    (async function(){
        const apiUrl = 'https://cms-nuevos3.sebastianvernis.workers.dev/api/articles?site=pulsorepublicanonoticias&limit=12';
        let articles = [];
        try {
            const res = await fetch(apiUrl);
            if(!res.ok) throw new Error('Network');
            const data = await res.json();
            articles = data.articles || [];
        } catch(e) {
            if (window.PWAManager) articles = await PWAManager.getLocalArticles();
        }
        if(!articles?.length) return;
        const headline = articles[0];
        const subheads = articles.slice(1, 4);
        const columns = articles.slice(4);
        const container = document.querySelector('.main-content');
        if(container) {
            container.innerHTML = '<div class="newspaper-masthead"><h1 class="paper-title">pulsorepublicanonoticias - News</h1>' +
                '<div class="paper-date">' + new Date().toLocaleDateString('es-MX', {weekday:'long', year:'numeric', month:'long', day:'numeric'}) + '</div></div>' +
                '<div class="newspaper-headline"><a href="/articulo/?slug=' + encodeURIComponent(headline.slug) + '">' +
                '<h1>' + headline.title + '</h1>' +
                '<img src="' + (headline.imageUrl || 'https://placehold.co/1200x500/dc2626/ffffff?text=News') + '" alt="' + headline.title + '">' +
                '<p>' + (headline.desc ? headline.desc.substring(0, 400) + '...' : '') + '</p></a></div>' +
                '<div class="newspaper-subheads">' + subheads.map(a =>
                    '<a href="/articulo/?slug=' + encodeURIComponent(a.slug) + '" class="subhead-item">' +
                    '<h3>' + a.title + '</h3><p>' + (a.desc ? a.desc.substring(0, 200) + '...' : '') + '</p></a>'
                ).join('') + '</div>' +
                '<div class="newspaper-columns">' + columns.map(a =>
                    '<a href="/articulo/?slug=' + encodeURIComponent(a.slug) + '" class="column-item">' +
                    '<h4>' + a.title + '</h4><p>' + (a.desc ? a.desc.substring(0, 160) + '...' : '') + '</p></a>'
                ).join('') + '</div>';
        }
    })();
    </script>
</body>
</html>
