<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>expresomexicano - News</title>
    <meta content="News site" name="description"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="style.css" rel="stylesheet"/>
    <link href="style-custom.css" rel="stylesheet"/>
    <link rel="alternate" type="application/rss+xml" title="expresomexicano RSS" href="/rss.xml"/>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="theme-color" content="#ea580c">
</head>
<body>
    <div id="site-preloader"><div class="loader"></div></div>
    <div id="site-header"></div>
    
    <main class="main-content">
    </main>

    <div id="site-footer"></div>
    
    <script src="pwa-manager.js"></script>
    <script src="components.js"></script>
    <script>
    (async function(){
        const apiUrl = 'https://cms-nuevos3.sebastianvernis.workers.dev/api/articles?site=expresomexicano&limit=12';
        let articles = [];
        try {
            const res = await fetch(apiUrl);
            if(!res.ok) throw new Error('Network');
            const data = await res.json();
            articles = data.articles || [];
        } catch(e) {
            if (window.PWAManager) articles = await PWAManager.getLocalArticles();
        }
        if(!articles?.length) return;
        const main = articles[0];
        const sub = articles.slice(1, 5);
        const rest = articles.slice(5);
        const container = document.querySelector('.main-content');
        if(container) {
            container.innerHTML = '<div class="bento-grid">' +
                '<a href="/articulo/?slug=' + encodeURIComponent(main.slug) + '" class="bento-main">' +
                '<img src="' + (main.imageUrl || 'https://placehold.co/800x600/ea580c/ffffff?text=News') + '" alt="' + main.title + '">' +
                '<div class="bento-overlay"><span class="bento-cat">' + (main.category || 'Noticias') + '</span><h1>' + main.title + '</h1></div></a>' +
                sub.map((a, i) =>
                    '<a href="/articulo/?slug=' + encodeURIComponent(a.slug) + '" class="bento-sub bento-sub-' + (i+1) + '">' +
                    '<img src="' + (a.imageUrl || 'https://placehold.co/400x300/ea580c/ffffff?text=News') + '" alt="' + a.title + '">' +
                    '<div class="bento-overlay"><span class="bento-cat">' + (a.category || 'Noticias') + '</span><h3>' + a.title + '</h3></div></a>'
                ).join('') + '</div>' +
                '<h2 class="section-label">Descubre m&aacute;s</h2><div class="bento-rest">' +
                rest.map(a =>
                    '<a href="/articulo/?slug=' + encodeURIComponent(a.slug) + '" class="bento-mini">' +
                    '<img src="' + (a.imageUrl || 'https://placehold.co/300x200/ea580c/ffffff?text=News') + '" alt="' + a.title + '">' +
                    '<div class="mini-body"><span class="mini-cat">' + (a.category || 'Noticias') + '</span><h4>' + a.title + '</h4></div></a>'
                ).join('') + '</div>';
        }
    })();
    </script>
</body>
</html>
