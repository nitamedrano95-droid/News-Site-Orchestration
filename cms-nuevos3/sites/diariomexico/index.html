<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>diariomexico - News</title>
    <meta content="News site" name="description"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="style.css" rel="stylesheet"/>
    <link href="style-custom.css" rel="stylesheet"/>
    <link rel="alternate" type="application/rss+xml" title="diariomexico RSS" href="/rss.xml"/>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="theme-color" content="#374151">
</head>
<body>
    <div id="site-preloader"><div class="loader"></div></div>
    <div id="site-header"></div>
    
    <main class="main-content">
    </main>

    <div id="site-footer"></div>
    
    <script src="pwa-manager.js"></script>
    <script src="script.js"></script>
    <script src="components.js"></script>
    <script>
    (async function(){
        const apiUrl = 'https://cms-nuevos3.sebastianvernis.workers.dev/api/articles?site=diariomexico&limit=12';
        let articles = [];
        try {
            const res = await fetch(apiUrl);
            if(!res.ok) throw new Error('Network');
            const data = await res.json();
            articles = data.articles || [];
        } catch(e) {
            if (window.PWAManager) articles = await PWAManager.getLocalArticles();
        }
        if(!articles?.length) return;
        const container = document.querySelector('.main-content');
        if(container) {
            container.innerHTML = '<div class="masonry-wall">' + articles.map((a, i) => {
                const shape = i % 3 === 0 ? 'tall' : i % 3 === 1 ? 'wide' : 'normal';
                const dims = i % 3 === 0 ? '400x600' : i % 3 === 1 ? '600x300' : '400x400';
                const descLen = i % 3 === 0 ? 200 : 80;
                return '<a href="/articulo/?slug=' + encodeURIComponent(a.slug) + '" class="masonry-brick brick-' + shape + '">' +
                    '<div class="brick-img"><img src="' + (a.imageUrl || 'https://placehold.co/' + dims + '/374151/ffffff?text=News') + '" alt="' + a.title + '"></div>' +
                    '<div class="brick-body"><span class="brick-cat">' + (a.category || 'Noticias') + '</span>' +
                    '<h3>' + a.title + '</h3><p>' + (a.desc ? a.desc.substring(0, descLen) + '...' : '') + '</p></div></a>';
            }).join('') + '</div>';
        }
    })();
    </script>
</body>
</html>
