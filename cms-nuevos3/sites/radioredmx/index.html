<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Red MX - Red de informacion</title>
  <meta name="description" content="Red de informacion">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23be123c'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3ER%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style-custom.css">
</head>
<body>
  <div id="site-preloader"></div>
  <div id="site-header"></div>
  <main class="container">
    <section class="hero-radio">
    <div class="wave-container">
      <div class="wave"></div><div class="wave"></div><div class="wave"></div>
    </div>
    <div class="radio-content">
      <span class="category-tag">En vivo</span>
      <h1>Ondas de informacion para Mexico</h1>
      <p>Transmision continua de noticias.</p>
    </div>
  </section>
    <section class="radio-grid">
    <article class="rad-card main"><div class="rad-waves"><div class="rw"></div><div class="rw"></div><div class="rw"></div></div><div class="rad-body"><span class="tag">En vivo</span><h3>Transmision informativa continua</h3><p>La senal siempre activa.</p></div></article>
    <article class="rad-card"><div class="rad-body"><span class="tag">Nacional</span><h3>Noticia en el aire</h3><p>Lo que circula ahora.</p></div></article>
    <article class="rad-card"><div class="rad-body"><span class="tag">Politica</span><h3>Frecuencia legislativa</h3><p>Desde el congreso.</p></div></article>
  </section>
  </main>
  <div id="site-footer"></div>
  <script src="components.js"></script>
</body>
</html>
