name = "cms-nuevos3"
main = "src/index.js"
compatibility_date = "2023-12-01"
workers_dev = true

# Rutas para interceptar requests a los sitios Pages e inyectar OG tags
# El Worker recibe requests a estos dominios, hace proxy al contenido Pages,
# e inyecta meta tags OG para Facebook/Twitter via injectMetaTags
routes = [
  { pattern = "enfoquemexicano.pages.dev", zone_name = "enfoquemexicano.pages.dev" },
  { pattern = "adnmexicano.pages.dev", zone_name = "adnmexicano.pages.dev" },
