worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 50m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/html
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # ── Upstream definitions ─────────────────────────────────────

    upstream wizard {
        server wizard:8080;
        keepalive 32;
    }

    upstream cms_originaux {
        server cms-originaux:3000;
        keepalive 32;
    }

    upstream cms_nuevos {
        server cms-nuevos:3000;
        keepalive 32;
    }

    upstream cms_nuevos2 {
        server cms-nuevos2:3000;
        keepalive 32;
    }

    upstream cms_nuevos3 {
        server cms-nuevos3:3000;
        keepalive 32;
    }

    # ── Main server block ─────────────────────────────────────────

    server {
        listen 80;
        server_name _;

        # Common proxy headers
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_buffering       off;

        # ── CMS API routes (strip prefix before proxying) ────────

        location /api/cms-originaux/ {
            proxy_pass http://cms_originaux/;
            proxy_read_timeout 120s;
        }

        location /api/cms-nuevos2/ {
            proxy_pass http://cms_nuevos2/;
            proxy_read_timeout 120s;
        }

        location /api/cms-nuevos3/ {
            proxy_pass http://cms_nuevos3/;
            proxy_read_timeout 120s;
        }

        # Note: /api/cms-nuevos/ must come after /api/cms-nuevos2/ and /api/cms-nuevos3/
        # to avoid prefix ambiguity
        location /api/cms-nuevos/ {
            proxy_pass http://cms_nuevos/;
            proxy_read_timeout 120s;
        }

        # ── Adapter health checks ─────────────────────────────────

        location /health/cms-originaux {
            proxy_pass http://cms_originaux/__adapter/health;
        }

        location /health/cms-nuevos {
            proxy_pass http://cms_nuevos/__adapter/health;
        }

        location /health/cms-nuevos2 {
            proxy_pass http://cms_nuevos2/__adapter/health;
        }

        location /health/cms-nuevos3 {
            proxy_pass http://cms_nuevos3/__adapter/health;
        }

        # ── Deploy Wizard (catch-all) ─────────────────────────────

        location / {
            proxy_pass http://wizard;
            proxy_read_timeout 60s;

            # WebSocket support for live status updates
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
