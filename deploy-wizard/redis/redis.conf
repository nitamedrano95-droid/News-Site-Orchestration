# redis.conf — NexoPress Redis Configuration
# Used as KV store polyfill for Cloudflare Workers KV binding

# ── Memory ───────────────────────────────────────────────────────────────────
maxmemory 256mb
maxmemory-policy allkeys-lru

# ── Persistence ──────────────────────────────────────────────────────────────
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Also keep RDB snapshots as a fallback
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# ── Logging ──────────────────────────────────────────────────────────────────
loglevel notice
logfile ""

# ── Performance ──────────────────────────────────────────────────────────────
tcp-backlog 511
timeout 0
tcp-keepalive 300
hz 10
dynamic-hz yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# ── Security ─────────────────────────────────────────────────────────────────
# Uncomment and set if you want password protection:
# requirepass your-redis-password

# Disable dangerous commands in production
rename-command FLUSHALL ""
rename-command FLUSHDB  ""
rename-command CONFIG   ""
rename-command DEBUG    ""
